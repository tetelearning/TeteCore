name: Pull Request Validation

on:
  pull_request:
    branches: [ develop ]
    paths-ignore:
      - '**.md'
      - 'docs/**'

env:
  DOTNET_VERSION: '8.0.x'
  NODE_VERSION: '20.x'

jobs:
  backend-tests:
    name: Backend Tests & Build
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
        
    - name: Restore dependencies
      run: dotnet restore
      
    - name: Build solution
      run: dotnet build --no-restore --configuration Release
      
    - name: Run tests
      run: dotnet test --no-build --configuration Release --logger trx --results-directory "TestResults" --collect:"XPlat Code Coverage"
      
    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results-backend
        path: TestResults
        
    - name: Upload coverage reports
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: coverage-reports-backend
        path: TestResults/**/coverage.cobertura.xml

  frontend-tests:
    name: Frontend Tests & Build
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: Tete.Web/ClientApp/package-lock.json
        
    - name: Install dependencies
      working-directory: Tete.Web/ClientApp
      run: npm ci
      
    - name: Run linting
      working-directory: Tete.Web/ClientApp
      run: npm run lint
      
    - name: Run tests
      working-directory: Tete.Web/ClientApp
      run: npm run test -- --watch=false --browsers=ChromeHeadless --code-coverage
      
    - name: Build Angular app
      working-directory: Tete.Web/ClientApp
      run: npm run build
      
    - name: Upload frontend coverage
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: coverage-reports-frontend
        path: Tete.Web/ClientApp/coverage

  security-scan:
    name: Security Scanning
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
        
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: Tete.Web/ClientApp/package-lock.json
        
    - name: Run .NET security audit
      run: dotnet list package --vulnerable --include-transitive 2>&1 | tee security-audit.log
      
    - name: Check for .NET vulnerabilities
      run: |
        if grep -q "has the following vulnerable packages" security-audit.log; then
          echo "::error::Vulnerable .NET packages found"
          cat security-audit.log
          exit 1
        else
          echo "No .NET security vulnerabilities found"
        fi
        
    - name: Install npm dependencies
      working-directory: Tete.Web/ClientApp
      run: npm ci
      
    - name: Run npm security audit
      working-directory: Tete.Web/ClientApp
      run: npm audit --audit-level=high
      
    - name: Upload security results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: security-audit-results
        path: security-audit.log

  docker-build-test:
    name: Docker Build Test
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      
    - name: Build Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Web.Dockerfile
        push: false
        tags: tete-web:pr-test
        cache-from: type=gha
        cache-to: type=gha,mode=max
        
    - name: Test Docker image
      run: |
        # Start the container
        docker run -d --name tete-test -p 8080:80 tete-web:pr-test
        
        # Wait for container to be ready
        timeout 60 bash -c 'until curl -f http://localhost:8080/health; do sleep 2; done'
        
        # Basic health check
        curl -f http://localhost:8080/health | grep -q '"status":"healthy"'
        
        # Cleanup
        docker stop tete-test
        docker rm tete-test

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests, docker-build-test]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      
    - name: Build Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Web.Dockerfile
        push: false
        tags: tete-web:integration-test
        cache-from: type=gha
        
    - name: Run integration tests
      run: |
        echo "Running integration test suite..."
        
        # Start the application container
        docker run -d --name tete-integration -p 8080:80 tete-web:integration-test
        
        # Wait for application to be ready
        timeout 90 bash -c 'until curl -f http://localhost:8080/health; do echo "Waiting for app..."; sleep 3; done'
        
        # Test health endpoint
        echo "Testing health endpoint..."
        curl -f http://localhost:8080/health | grep -q '"status":"healthy"'
        
        # Test that Angular app loads
        echo "Testing Angular app..."
        curl -f http://localhost:8080/ | grep -q "Tête (beta)"
        
        # Test API endpoints that don't require database
        echo "Testing API accessibility..."
        curl -f -I http://localhost:8080/health
        
        echo "Integration tests completed successfully"
        
        # Cleanup
        docker stop tete-integration
        docker rm tete-integration

  pr-summary:
    name: PR Validation Summary
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests, security-scan, docker-build-test, integration-tests]
    if: always()
    
    steps:
    - name: Check all jobs status
      run: |
        echo "PR Validation Summary:"
        echo "Backend Tests: ${{ needs.backend-tests.result }}"
        echo "Frontend Tests: ${{ needs.frontend-tests.result }}"
        echo "Security Scan: ${{ needs.security-scan.result }}"
        echo "Docker Build: ${{ needs.docker-build-test.result }}"
        echo "Integration Tests: ${{ needs.integration-tests.result }}"
        
        if [[ "${{ needs.backend-tests.result }}" == "success" && 
              "${{ needs.frontend-tests.result }}" == "success" && 
              "${{ needs.security-scan.result }}" == "success" && 
              "${{ needs.docker-build-test.result }}" == "success" && 
              "${{ needs.integration-tests.result }}" == "success" ]]; then
          echo "✅ All validation checks passed!"
        else
          echo "❌ Some validation checks failed"
          exit 1
        fi